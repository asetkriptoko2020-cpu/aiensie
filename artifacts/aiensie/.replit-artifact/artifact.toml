kind = "web"
previewPath = "/"
title = "Aiensie Landing Page"
version = "1.0.0"
id = "artifacts/aiensie"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "cd artifacts/aiensie && PORT=5173 BASE_PATH=/ pnpm run dev -- --host 0.0.0.0"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aiensie", "run", "build" ]
publicDir = "artifacts/aiensie/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
