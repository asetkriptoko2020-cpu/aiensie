<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Aiensie Landing Page</title>
    <meta name="description" content="Aiensie Landing Page — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Aiensie Landing Page" />
    <meta property="og:description" content="Aiensie Landing Page — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aiensie Landing Page" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <div id="fallback" style="position:fixed;top:0;left:0;width:100%;padding:16px;background:#1a1a2e;color:#a0c4ff;font-family:monospace;font-size:14px;z-index:9999;pointer-events:none;">
      Aiensie app loaded
    </div>
    <script type="module">
      // Hide fallback once React mounts
      document.addEventListener('DOMContentLoaded', function() {
        requestAnimationFrame(function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            var fallback = document.getElementById('fallback');
            if (fallback && root && root.children.length > 0) {
              fallback.style.display = 'none';
            }
          }, 2000);
        });
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
